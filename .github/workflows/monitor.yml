name: PS5 Sniper

on:
  schedule:
    # Интервал проверки. Сейчас — раз в час, в 17 минут каждого часа (UTC).
    # Каждые 30 минут: "*/30 * * * *". Каждые 2 часа: "17 */2 * * *".
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ps5-sniper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Makler.md
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m sniper.main

      - name: Save state
        if: always()
        run: |
          git config user.name "ps5-sniper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
